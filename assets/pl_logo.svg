<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Premier League Lion Logo -->
  <defs>
    <style>
      .lion-head { fill: #ffffff; }
      .crown { fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Simplified PL Lion Head -->
  <g class="lion-head">
    <!-- Main head shape -->
    <circle cx="40" cy="42" r="20" fill="#ffffff"/>
    
    <!-- Left ear -->
    <circle cx="28" cy="28" r="8" fill="#ffffff"/>
    
    <!-- Right ear -->
    <circle cx="52" cy="28" r="8" fill="#ffffff"/>
    
    <!-- Mane spikes - left -->
    <path d="M 22 35 L 18 30 L 24 32 Z" fill="#ffffff"/>
    <path d="M 18 42 L 12 40 L 20 42 Z" fill="#ffffff"/>
    <path d="M 20 50 L 15 52 L 22 48 Z" fill="#ffffff"/>
    
    <!-- Mane spikes - right -->
    <path d="M 58 35 L 62 30 L 56 32 Z" fill="#ffffff"/>
    <path d="M 62 42 L 68 40 L 60 42 Z" fill="#ffffff"/>
    <path d="M 60 50 L 65 52 L 58 48 Z" fill="#ffffff"/>
    
    <!-- Face details -->
    <ellipse cx="34" cy="40" rx="3" ry="4" fill="#37003c"/>
    <ellipse cx="46" cy="40" rx="3" ry="4" fill="#37003c"/>
    <path d="M 36 48 Q 40 52 44 48" stroke="#37003c" stroke-width="2" fill="none"/>
    <circle cx="40" cy="46" r="2" fill="#37003c"/>
  </g>
  
  <!-- Crown -->
  <g class="crown">
    <path d="M 30 22 L 32 18 L 34 22 L 36 16 L 38 22 L 40 14 L 42 22 L 44 16 L 46 22 L 48 18 L 50 22 L 50 26 L 30 26 Z" fill="#ffffff" stroke="#37003c" stroke-width="0.5"/>
    <circle cx="32" cy="18" r="1.5" fill="#00ffff"/>
    <circle cx="36" cy="16" r="1.5" fill="#00ffff"/>
    <circle cx="40" cy="14" r="1.5" fill="#00ffff"/>
    <circle cx="44" cy="16" r="1.5" fill="#00ffff"/>
    <circle cx="48" cy="18" r="1.5" fill="#00ffff"/>
  </g>
</svg>
